<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080D18" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        const validThemes = ["dark", "light", "system"];
        let preference = "system";
        try {
          const storedPreference = localStorage.getItem("portfolio-theme");
          if (validThemes.includes(storedPreference)) {
            preference = storedPreference;
          }
        } catch {
          preference = "system";
        }

        const systemPrefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        const resolvedTheme =
          preference === "system"
            ? systemPrefersDark
              ? "dark"
              : "light"
            : preference;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.dataset.theme = resolvedTheme;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", resolvedTheme === "dark" ? "#080D18" : "#F5F7FB");
      })();
    </script>
    <title>Ebba Meshu | Full-Stack Developer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
